<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jocs dels segles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fredoka:wght@500;600&display=swap">
<style>

[hidden]{display:none!important} body{margin:0} img{max-width:100%}
:root{
  --bg:#f7efe1; --panel:#fffaf1; --ink:#2b2118; --muted:#76624c; --line:#e3d2b4;
  --brown:#6b4a2b; --ochre:#c8952e; --ochre-soft:#f6e6c4;
  --ok:#2f7d45; --ok-soft:#e3f1e5; --bad:#b8322a; --bad-soft:#f9e3df;
  --card-back:#6b4a2b; --on-accent:#ffffff;
  --shadow:0 2px 0 rgba(107,74,43,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1e1812; --panel:#2a221a; --ink:#f3e9d8; --muted:#c9b393; --line:#4a3b2b;
    --brown:#d8a869; --ochre:#e0ae4a; --ochre-soft:#3a2e1c;
    --ok:#6cc487; --ok-soft:#1f3326; --bad:#f08a7e; --bad-soft:#3d2320;
    --card-back:#8a6038; --on-accent:#1e1812; --shadow:0 2px 0 rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1e1812; --panel:#2a221a; --ink:#f3e9d8; --muted:#c9b393; --line:#4a3b2b;
  --brown:#d8a869; --ochre:#e0ae4a; --ochre-soft:#3a2e1c;
  --ok:#6cc487; --ok-soft:#1f3326; --bad:#f08a7e; --bad-soft:#3d2320;
  --card-back:#8a6038; --on-accent:#1e1812; --shadow:0 2px 0 rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;font-size:17px;line-height:1.45;padding-inline:16px;padding-block:14px 40px}
.wrap{max-width:960px;margin:0 auto}
h1,h2,h3,.fred{font-family:"Fredoka","Trebuchet MS",sans-serif;font-weight:600;text-wrap:balance;margin:0}
.en{font-style:italic;color:var(--muted);font-weight:400}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--ochre);outline-offset:3px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.bar .t{flex:1;min-width:0}
.bar .t h2{font-size:22px;color:var(--brown)}
.bar .t .en{font-size:14px}
.ico{flex:none;width:46px;height:46px;border-radius:12px;border:2px solid var(--line);background:var(--panel);display:grid;place-items:center;font-family:"Fredoka",sans-serif;font-size:22px;font-weight:600;color:var(--brown)}
.ico svg{width:24px;height:24px}
/* home */
.hero{text-align:center;padding:10px 0 18px}
.hero .kick{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-size:clamp(28px,6vw,42px);color:var(--brown);margin:4px 0}
.hero p{margin:0}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:760px;margin:0 auto}
@media (max-width:520px){.menu{grid-template-columns:1fr}}
.big{display:flex;flex-direction:column;align-items:stretch;text-align:left;border:2px solid var(--line);background:var(--panel);border-radius:16px;overflow:hidden;padding:0;box-shadow:var(--shadow)}
.big img{width:100%;aspect-ratio:16/8;object-fit:cover;display:block}
.big .bt{padding:12px 14px 14px}
.big .bt b{display:block;font-family:"Fredoka",sans-serif;font-size:24px;color:var(--brown)}
.big .bt span{display:block;font-size:15px}
.big.study{border-color:var(--ochre)}
.big:hover{transform:translateY(-2px)}
/* instructions */
.howto{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:18px}
.steps{list-style:none;padding:0;margin:14px 0;display:grid;gap:10px}
.steps li{display:flex;gap:12px;align-items:flex-start}
.steps .n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--brown);color:var(--on-accent);display:grid;place-items:center;font-family:"Fredoka",sans-serif;font-size:18px}
.steps b{display:block}
.rules{background:var(--ochre-soft);border:2px dashed var(--ochre);border-radius:14px;padding:12px 14px;display:grid;gap:6px}
.rules div{display:flex;gap:10px;align-items:baseline}
.rules strong{white-space:nowrap}
.go{margin-top:16px;width:100%;background:var(--brown);color:var(--on-accent);border:0;border-radius:14px;padding:16px;font-family:"Fredoka",sans-serif;font-size:24px}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:12px 0}
.opt{border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:14px;text-align:left}
.opt b{display:block;font-family:"Fredoka",sans-serif;font-size:21px;color:var(--brown)}
.opt span{font-size:15px}
.sub{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.fxh{font-family:"Fredoka",sans-serif;font-weight:600;font-size:20px;color:var(--brown);margin:18px 0 8px;border-bottom:2px solid var(--line);padding-bottom:4px}
.fxh:first-child{margin-top:0}
.lbl{font-family:"Fredoka",sans-serif;font-size:18px;margin-top:10px;color:var(--brown)}
/* cards */
.status{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--muted);margin-bottom:10px;gap:8px;flex-wrap:wrap}
.status b{color:var(--ink);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:420px){.grid{grid-template-columns:repeat(2,1fr)}}
.card{position:relative;aspect-ratio:16/10.5;border:0;padding:0;background:none;perspective:800px}
.card .in{position:absolute;inset:0;transition:transform .45s;transform-style:preserve-3d}
.card.up .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:2px solid var(--line)}
.back{background:var(--card-back);border-color:var(--card-back);color:var(--on-accent);font-family:"Fredoka",sans-serif;font-size:34px}
.front{background:var(--panel);transform:rotateY(180deg);padding:6px}
.front img{width:100%;height:100%;object-fit:contain;border-radius:8px;background:#f7efe1}
.word b{font-family:"Fredoka",sans-serif;font-size:clamp(17px,3.2vw,24px);line-height:1.1;color:var(--brown)}
.word .en{font-size:clamp(12px,2.2vw,15px);margin-top:3px}
.card.done .face.front{border-color:var(--ok);background:var(--ok-soft)}
.card.shake .in{animation:shake .4s}
@keyframes shake{0%,100%{translate:0}25%{translate:-6px}75%{translate:6px}}
/* relate */
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;max-width:680px;margin:0 auto}
.col{display:grid;gap:10px}
.tile{border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:6px;min-height:0;aspect-ratio:16/9.6;display:flex;align-items:center;justify-content:center;text-align:center;flex-direction:column}
.tile img{width:100%;height:100%;object-fit:contain;border-radius:8px;background:#f7efe1}
.cols.defs{max-width:900px}
.cols.defs .tile{aspect-ratio:auto;min-height:150px}
.dimg{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%}
.dimg img{width:100%;height:auto;max-height:120px;object-fit:contain;border-radius:8px;background:#f7efe1}
.dimg p{margin:0;font-size:16px;line-height:1.3;text-align:center}
.dimg p.en{font-size:13px}
.front .dimg img{max-height:58%}
.front .dimg p{font-size:clamp(11px,1.6vw,14px)}
.front .dimg p.en{display:none}
.tile.sel{border-color:var(--ochre);box-shadow:0 0 0 3px var(--ochre)}
.tile.done{border-color:var(--ok);background:var(--ok-soft);cursor:default}
.tile.shake{animation:shake .4s}
.log{margin-top:14px;display:grid;gap:8px}
.log div{background:var(--ok-soft);border:1.5px solid var(--ok);border-radius:10px;padding:8px 12px;font-size:15px}
.log div b{color:var(--ok)}
/* order */
.pool{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:520px){.pool{grid-template-columns:repeat(2,1fr)}}
.ev{border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:6px;text-align:center}
.ev img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:8px;display:block}
.ev span{display:block;font-size:15px;padding:4px 2px 2px;line-height:1.25}
.ev .en{font-size:13px}
.ev.gone{visibility:hidden}
.ev.shake{animation:shake .4s;border-color:var(--bad);background:var(--bad-soft)}
.line{margin-top:16px;display:grid;grid-template-columns:repeat(6,1fr);gap:6px;position:relative}
@media (max-width:640px){.line{grid-template-columns:repeat(3,1fr)}}
.slot{border:2px dashed var(--line);border-radius:10px;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:5px;text-align:center;font-size:13px}
.slot .num{font-family:"Fredoka",sans-serif;color:var(--muted);font-size:18px}
.slot.full{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.slot img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:6px}
.slot .yr{font-family:"Fredoka",sans-serif;color:var(--on-accent);background:var(--ochre);border-radius:6px;padding:0 8px;font-size:16px;margin:3px 0 2px}
.msg{margin-top:12px;min-height:26px;font-size:16px}
.msg.bad{color:var(--bad)} .msg.ok{color:var(--ok)}
/* win */
.win{text-align:center;background:var(--ok-soft);border:2px solid var(--ok);border-radius:18px;padding:22px;margin-top:16px}
.win h2{color:var(--ok);font-size:30px}
.win .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.btn{border:2px solid var(--brown);background:var(--panel);color:var(--brown);border-radius:12px;padding:10px 16px;font-family:"Fredoka",sans-serif;font-size:18px}
.btn.fill{background:var(--brown);color:var(--on-accent)}
/* study */
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.tab{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 16px;font-family:"Fredoka",sans-serif;font-size:17px}
.tab[aria-selected="true"]{background:var(--brown);border-color:var(--brown);color:var(--on-accent)}
.toggle{display:flex;align-items:center;gap:10px;background:var(--ochre-soft);border:2px solid var(--ochre);border-radius:12px;padding:10px 12px;margin-bottom:12px;flex-wrap:wrap}
.toggle{display:block}
.tth b{font-family:"Fredoka",sans-serif;font-size:21px;color:var(--brown)}
.tsteps{margin:6px 0 10px;padding-left:22px;display:grid;gap:3px}
.tbtn{width:100%;background:var(--brown);color:var(--on-accent);border:0;border-radius:12px;padding:14px;font-family:"Fredoka",sans-serif;font-size:20px}
.tbtn .en2{font-family:"Atkinson Hyperlegible",sans-serif;font-style:italic;font-size:16px;opacity:.9}
.tbtn.on{background:var(--ok);}
.testing .fx .hide{background:var(--ochre-soft);border:2px dashed var(--ochre);border-radius:8px;padding:8px;text-align:center;font-weight:700;color:var(--ink)!important}
.fitxes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.fitxes{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fx{border:2px solid var(--line);background:var(--panel);border-radius:14px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column}
.fx img{width:100%;aspect-ratio:16/9;object-fit:contain;background:#f7efe1;display:block}
.fx .ft{padding:8px 12px 12px}
.fx .ft b{font-family:"Fredoka",sans-serif;font-size:21px;color:var(--brown);display:block}
.fx .ft .en{font-size:14px;display:block}
.fx .ft p{margin:4px 0 0;font-size:15px}
.fx .hide{display:none}
.testing .fx .ft .txt{display:none}
.testing .fx .hide{display:block;color:var(--muted);font-size:15px}
.testing .fx.show .ft .txt{display:block}
.testing .fx.show .hide{display:none}
.tl{display:grid;gap:10px}
.tlr{display:grid;grid-template-columns:90px 140px 1fr;gap:12px;align-items:center;border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:8px}
.tlr .y{font-family:"Fredoka",sans-serif;font-size:26px;color:var(--ochre);text-align:center}
.tlr img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:8px}
@media (max-width:520px){.tlr{grid-template-columns:70px 1fr}.tlr img{display:none}}
.story{margin-top:16px;background:var(--panel);border:2px solid var(--ochre);border-radius:16px;padding:16px 18px}
.story h3{color:var(--brown);font-size:22px;margin-bottom:6px}
.story p{margin:6px 0;max-width:70ch}
.wq{background:var(--panel);border:2px solid var(--ochre);border-radius:16px;padding:18px;text-align:center;margin-bottom:14px}
.wq b{display:block;font-family:"Fredoka",sans-serif;font-weight:600;font-size:clamp(22px,4vw,30px);color:var(--brown)}
.wq .en{font-size:16px}
.kings{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.king{border:2px solid var(--line);background:var(--panel);border-radius:16px;padding:8px;text-align:center}
.king img{width:100%;aspect-ratio:16/9;object-fit:contain;border-radius:10px;background:#f7efe1;display:block}
.king b{display:block;font-family:"Fredoka",sans-serif;font-size:24px;color:var(--brown);margin-top:4px}
.king .en{font-size:14px}
.king.shake,.both.shake{animation:shake .4s;border-color:var(--bad);background:var(--bad-soft)}
.both{margin-top:12px;width:100%;border:2px solid var(--brown);background:var(--panel);color:var(--brown);border-radius:14px;padding:14px;font-family:"Fredoka",sans-serif;font-size:22px}
.ogrid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1fr);gap:14px}
.olist,.ylist{display:grid;gap:8px;margin-top:6px}
.orow{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:center;border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:6px;text-align:left}
@media (max-width:560px){.ogrid{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}.orow{grid-template-columns:1fr}}
.orow img{width:100%;aspect-ratio:16/10;object-fit:contain;background:#f7efe1;border-radius:8px}
.orow b{display:block;font-size:17px} .orow .en{font-size:14px}
.ychip{border:2px solid var(--line);background:var(--panel);border-radius:12px;min-height:64px;font-family:"Fredoka",sans-serif;font-size:28px;color:var(--ochre)}
.orow.sel,.ychip.sel{border-color:var(--ochre);box-shadow:0 0 0 3px var(--ochre)}
.orow.shake,.ychip.shake{animation:shake .4s;border-color:var(--bad);background:var(--bad-soft)}
.orow.gone,.ychip.gone{opacity:.25;cursor:default}
.tl .tlr.empty{border-style:dashed;min-height:64px;grid-template-columns:90px 1fr}
.tl .tlr.empty .ph{display:none}
.tlr.empty .y{color:var(--muted)}
.tlr.full{border-color:var(--ok);background:var(--ok-soft)}
.note{margin-top:14px;font-size:15px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- joc dels segles: sempre en clar (el fons és una il·lustració clara) ---- */
:root,:root[data-theme="dark"]{color-scheme:light;
  --bg:#f7efe1; --panel:#fffaf1; --ink:#2b2118; --muted:#76624c; --line:#e3d2b4;
  --brown:#6b4a2b; --ochre:#c8952e; --ochre-soft:#f6e6c4;
  --ok:#2f7d45; --ok-soft:#e3f1e5; --bad:#b8322a; --bad-soft:#f9e3df;
  --card-back:#6b4a2b; --on-accent:#ffffff; --shadow:0 2px 0 rgba(107,74,43,.18);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:light;
  --bg:#f7efe1; --panel:#fffaf1; --ink:#2b2118; --muted:#76624c; --line:#e3d2b4;
  --brown:#6b4a2b; --ochre:#c8952e; --ochre-soft:#f6e6c4;
  --ok:#2f7d45; --ok-soft:#e3f1e5; --bad:#b8322a; --bad-soft:#f9e3df;
  --card-back:#6b4a2b; --on-accent:#ffffff; --shadow:0 2px 0 rgba(107,74,43,.18);}}
html,body{background:var(--bg)}
#bgimg{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;opacity:.9}
.hero .cover{width:100%;max-width:760px;border-radius:18px;border:2px solid var(--line);display:block;margin:10px auto 6px;box-shadow:var(--shadow)}
.menu{grid-template-columns:repeat(3,minmax(0,1fr));max-width:960px}
@media (max-width:760px){.menu{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:460px){.menu{grid-template-columns:1fr}}
.big .bt b{font-size:21px}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin:12px 0}
.panel h3{color:var(--brown);font-size:21px;margin-bottom:6px}
.panel p{margin:6px 0}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:960px;margin:0 auto}
@media (max-width:620px){.levels{grid-template-columns:1fr}}
.lv{border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:10px 12px;text-align:left}
.lv b{display:block;font-family:"Fredoka",sans-serif;font-size:19px;color:var(--brown)}
.lv span{font-size:14px}
.lv[aria-pressed="true"]{border-color:var(--ochre);box-shadow:0 0 0 3px var(--ochre);background:var(--ochre-soft)}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:8px 0 0}
@media (max-width:620px){.steps3{grid-template-columns:1fr}}
.steps3 div{display:flex;gap:10px;align-items:flex-start}
.steps3 .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--brown);color:#fff;display:grid;place-items:center;font-family:"Fredoka",sans-serif}
.steps3 .en{display:block}
.wq .qbig{display:block;margin-bottom:4px}
.lvltag{display:inline-block;background:var(--ochre-soft);border:1.5px solid var(--ochre);border-radius:999px;padding:2px 10px;font-size:13px;margin-left:6px;vertical-align:middle}
/* nom del segle */
.sg{display:flex;flex-direction:column;align-items:center;line-height:1.15}
.sg .r{font-family:"Fredoka",sans-serif;font-weight:600;font-size:clamp(24px,5vw,34px);color:var(--brown)}
.sg .ca{font-size:15px;font-weight:700}
.sg .en{font-size:13px}
/* trucs */
.tlwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:8px -4px 0;padding:0 4px}
.tlfig{position:relative;min-width:720px;padding:34px 0 64px}
.tlfig img{width:100%;display:block}
.tlfig .lab{position:absolute;top:6px;transform:translateX(-50%);font-family:"Fredoka",sans-serif;font-weight:600;font-size:15px;white-space:nowrap}
.tlfig .lab.ac{color:#3d6a8a}.tlfig .lab.dc{color:#9a6a12}
.tlfig .cap{position:absolute;bottom:0;font-size:14px;line-height:1.25}
.tlfig .cap b{font-family:"Fredoka",sans-serif;font-size:17px}
.tlfig .cap.l{left:2%;color:#3d6a8a}.tlfig .cap.r{right:2%;text-align:right;color:#9a6a12}
.tlfig .cap.m{left:50%;transform:translateX(-50%);text-align:center;color:var(--brown);bottom:20px}
.note{font-size:15px}
.rtable{width:100%;border-collapse:collapse;margin-top:8px;font-size:15px;background:#fff}
.rtable th,.rtable td{border:1px solid var(--line);padding:5px 8px;text-align:left}
.rtable th{background:var(--ochre-soft);font-family:"Fredoka",sans-serif;font-weight:600}
.rtable td.ro{font-family:"Fredoka",sans-serif;font-weight:600;color:var(--brown);font-size:18px}
.demo{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:center;background:#fff;border:2px dashed var(--ochre);border-radius:14px;padding:12px;margin:10px 0;font-family:"Fredoka",sans-serif;font-size:clamp(20px,4.5vw,30px);color:var(--brown)}
.demo .hide{background:var(--brown);color:var(--brown);border-radius:6px;padding:0 4px}
.demo .ar{color:var(--ochre)}
.demo .small{font-family:"Atkinson Hyperlegible",sans-serif;font-size:15px;color:var(--muted)}
.btn2{border:2px solid var(--brown);background:var(--panel);color:var(--brown);border-radius:12px;padding:8px 14px;font-family:"Fredoka",sans-serif;font-size:17px}
.warn{background:var(--bad-soft);border:2px solid var(--bad);border-radius:14px;padding:12px 14px;margin:12px 0}
.warn h3{color:var(--bad)}
/* targetes */
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.fgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:420px){.fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fc{position:relative;aspect-ratio:3/3.4;border:0;padding:0;background:none;perspective:800px}
.fc .in{position:absolute;inset:0;transition:transform .45s;transform-style:preserve-3d}
.fc.up .in{transform:rotateY(180deg)}
.fc .f{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px;border:2px solid var(--line)}
.fc .f1{background:var(--panel)}
.fc .f1 .yr{font-family:"Fredoka",sans-serif;font-weight:600;font-size:clamp(26px,6vw,40px);color:var(--brown)}
.fc .f1 .q{font-size:13px;color:var(--muted)}
.fc .f2{transform:rotateY(180deg)}
.fc .f2 .x{font-size:12px;color:var(--muted);margin-top:4px}
.fc .bk{background-size:cover;background-position:center;border-color:#8a5a33}
.fc.done .f2{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok)}
.fc.shake .in{animation:shake .4s}
/* opcions */
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:6px}
@media (max-width:460px){.opts{grid-template-columns:1fr}}
.op{border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:12px 8px;min-height:84px}
.op.big1{font-family:"Fredoka",sans-serif;font-weight:600;font-size:clamp(26px,6vw,36px);color:var(--brown)}
.op.ok{border-color:var(--ok);background:var(--ok-soft)}
.op.shake{animation:shake .4s;border-color:var(--bad);background:var(--bad-soft)}
.op:disabled{cursor:default}
.qbig{font-family:"Fredoka",sans-serif;font-weight:600;font-size:clamp(40px,10vw,64px);color:var(--brown);line-height:1}
.streak{display:inline-block;background:var(--ochre);color:#fff;border-radius:999px;padding:1px 10px;font-weight:700}
.next{margin-top:12px;width:100%;background:var(--brown);color:#fff;border:0;border-radius:14px;padding:13px;font-family:"Fredoka",sans-serif;font-size:21px}
/* quins anys */
.chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:10px}
@media (max-width:460px){.chips{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ych{border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:12px 4px;font-family:"Fredoka",sans-serif;font-weight:600;font-size:26px;color:var(--brown)}
.ych[aria-pressed="true"]{border-color:var(--ochre);box-shadow:0 0 0 3px var(--ochre);background:var(--ochre-soft)}
.ych.good{border-color:var(--ok);background:var(--ok-soft);box-shadow:none}
.ych.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:none}
.ych.missed{border:3px dashed var(--bad);box-shadow:none}
.ych small{display:block;font-family:"Atkinson Hyperlegible",sans-serif;font-size:12px;font-weight:400;color:var(--ink)}
.legend{font-size:14px;color:var(--muted);margin-top:8px}
/* posa'l al seu segle */
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:14px}
@media (max-width:640px){.pgrid{grid-template-columns:1fr}}
.evs{display:grid;gap:8px}
.ev2{border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 10px;text-align:left}
.ev2 .y{font-family:"Fredoka",sans-serif;font-weight:600;font-size:22px;color:var(--brown);margin-right:6px}
.ev2 .en{display:block;font-size:13px}
.ev2.sel{border-color:var(--ochre);box-shadow:0 0 0 3px var(--ochre)}
.ev2.shake{animation:shake .4s;border-color:var(--bad);background:var(--bad-soft)}
.slots{display:grid;gap:8px}
.slot2{border:2px solid var(--line);border-radius:12px;padding:6px 10px;text-align:left;display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;min-height:56px}
.slot2 .hd{text-align:center;line-height:1.1}
.slot2 .hd b{font-family:"Fredoka",sans-serif;font-size:24px;color:var(--brown);display:block}
.slot2 .hd span{font-size:12px}
.slot2 .in2{display:flex;flex-wrap:wrap;gap:6px}
.slot2 .pl{background:#fff;border:1.5px solid var(--ok);border-radius:10px;padding:3px 8px;font-size:14px}
.slot2 .pl b{color:var(--ok)}
.slot2.shake{animation:shake .4s}
.win img.wimg{width:140px;display:block;margin:0 auto 6px}
</style>
</head>

function winBox(text, again) {
  const d = document.createElement('div');
  d.className = 'win';
  d.innerHTML = `<img class="wimg" src="${IMG.VICTORIA}" alt=""><h2>Ho has aconseguit!</h2><div class="en">Well done!</div><p>${text}</p>
  <div class="row"><button class="btn fill" id="again">Torna a jugar · Play again</button><button class="btn" id="back">Inici · Home</button></div>`;

  setTimeout(() => sfx('win'), 300);
  d.querySelector('#again').onclick = again;
  d.querySelector('#back').onclick = home;
  d.scrollIntoView({behavior: 'smooth', block: 'center'});
}

function gira() {
  BACK = pickCards;
  const ys = new Set(); while (ys.size < 12) ys.add(randYear());

  <div class="status"><span>Girades · Flipped: <b id="c">0</b> / 12</span><span>${L().ca}</span></div>
  <div class="fgrid">${list.map(y => { const c = cent(y); return `<button class="fc" aria-label="Any ${y}"><div class="in">

  <button class="next" id="new">🔄 Noves targetes · New cards</button>`;
  wire(); app.querySelector('[data-act="help"]').onclick = () => howto('gira', gira, pickCards);

function parelles() {
  BACK = pickCards;
  const cs = shuffle(Array.from({length: L().max - L().min + 1}, (_, i) => L().min + i)).slice(0, 6);
  const deck = shuffle(cs.flatMap((c, i) => [{i, k: 'y', y: yearIn(c, L().z), c}, {i, k: 'c', c}]));
  let open = [], lock = false, done = 0, tries = 0;
  app.innerHTML = bar('Parelles', 'Pairs', true) + `
  <div class="status"><span>Parelles · Pairs: <b id="c">0</b> / 6</span><span>Intents · Tries: <b id="t">0</b></span></div>
  <div class="fgrid">${deck.map((d, n) => `<button class="fc" data-n="${n}" aria-label="Targeta ${n + 1}"><div class="in">
   <div class="f bk" style="background-image:url(${IMG.DORS_TARGETA})"></div>
   <div class="f f2" style="background:${d.k === 'c' ? segColor(d.c) : 'var(--panel)'}">${d.k === 'c' ? segHTML(d.c) : `<span class="qbig" style="font-size:clamp(28px,6vw,40px)">${d.y}</span>`}</div></div></button>`).join('')}</div>
  <div class="log"></div>`;
  wire(); app.querySelector('[data-act="help"]').onclick = () => howto('parelles', parelles, pickCards);
  app.querySelectorAll('.fc').forEach(el => el.onclick = () => {
    if (lock || el.classList.contains('up')) return;
    el.classList.add('up'); open.push(el); sfx('tap');
    if (open.length < 2) return;
    tries++; app.querySelector('#t').textContent = tries;
    const [a, b] = open.map(e => deck[+e.dataset.n]);
    if (a.i === b.i && a.k !== b.k) {
      open.forEach(e => e.classList.add('done')); open = []; sfx('ok');
      done++; app.querySelector('#c').textContent = done;
      const yy = a.k === 'y' ? a.y : b.y, l = document.createElement('div'); l.innerHTML = explain(yy); app.querySelector('.log').prepend(l);
      if (done === 6) winBox(`Has trobat les 6 parelles en ${tries} intents.`, parelles);
    } else {
      lock = true;
      setTimeout(() => { sfx('bad'); open.forEach(e => e.classList.add('shake')); }, 700);
      setTimeout(() => { open.forEach(e => e.classList.remove('up', 'shake')); open = []; lock = false; }, 1200);
    }
  });
}

/* ---------- preguntes de tria (romans i quin segle) ---------- */
const CONF = {4: 6, 6: 4, 9: 11, 11: 9, 14: 16, 16: 14, 19: 21, 21: 19};
function quiz(cfg) {
  BACK = home;
  const N = 10; let k = 0, errors = 0, streak = 0, q = null;
  app.innerHTML = bar(cfg.title, cfg.en, true) + `
  <div class="status"><span>Pregunta · Question: <b id="c">1</b> / ${N}</span><span id="st"></span><span>Errors: <b id="e">0</b></span></div>
  <div class="wq" id="q"></div><div class="opts" id="o"></div><div class="msg" id="msg"></div><div class="log"></div>`;
  wire(); app.querySelector('[data-act="help"]').onclick = () => howto(cfg.key, cfg.again);
  const show = () => {
    q = cfg.make(); app.querySelector('#c').textContent = k + 1;
    app.querySelector('#q').innerHTML = q.ask;
    app.querySelector('#o').innerHTML = shuffle(q.opts).map(o => `<button class="op ${q.big ? 'big1' : ''}" data-v="${o.v}">${o.h}</button>`).join('');
    app.querySelectorAll('.op').forEach(b => b.onclick = () => {
      const msg = app.querySelector('#msg');
      if (b.dataset.v === String(q.ans)) {
        sfx('ok'); streak++; b.classList.add('ok');
        app.querySelector('#st').innerHTML = streak >= 3 ? `<span class="streak">${streak} seguits! 🔥</span>` : '';
        msg.className = 'msg ok'; msg.innerHTML = 'Molt bé! ' + q.why;
        const d = document.createElement('div'); d.innerHTML = q.why; app.querySelector('.log').prepend(d);
        app.querySelectorAll('.op').forEach(x => x.disabled = true);
        k++;
        setTimeout(() => { if (k === N) { app.querySelector('#q').innerHTML = '<b>Totes fetes!</b><span class="en">All done!</span>'; app.querySelector('#o').innerHTML = ''; winBox(`Has fet les ${N} preguntes. Errors: ${errors}.`, cfg.again); } else show(); }, 1100);
      } else {
        sfx('bad'); errors++; streak = 0; app.querySelector('#e').textContent = errors; app.querySelector('#st').innerHTML = '';
        shake(b); msg.className = 'msg bad'; msg.innerHTML = q.hint;
      }
    });
  };
  show();
}
function romans() {
  quiz({title: 'Romans ↔ números', en: 'Roman ↔ numbers', key: 'romans', again: romans, make: () => {
    const n = rnd(L().min, L().max);
    const pool = new Set([CONF[n], n - 1, n + 1, n - 2, n + 2].filter(x => x >= 1 && x <= 21 && x !== n));
    const ds = [...pool].slice(0, 2);
    if (CONF[n] && !ds.includes(CONF[n])) ds[1] = CONF[n];
    const toNum = Math.random() < 0.5;
    const opts = [n, ...ds].map(x => ({v: x, h: toNum ? String(x) : ROM(x)}));
    return {ans: n, opts, big: true,
      ask: toNum ? `<span class="qbig">${ROM(n)}</span><span class="en">Quin número és? · Which number is it?</span>`
                 : `<span class="qbig">${n}</span><span class="en">Com s'escriu en romà? · How do you write it in Roman numerals?</span>`,
      why: `${ROM(n)} = ${n} · segle ${CA[n]} · <span class="en">${EN[n]} century (${ORD(n)})</span>`,
      hint: 'Pista: I = 1, V = 5, X = 10. Petita darrere, se suma; petita davant, es resta. <span class="en">Hint: small after adds, small before subtracts.</span>'};
  }});
}
function quinSegle() {
  quiz({title: 'De quin segle és?', en: 'Which century is it?', key: 'quinsegle', again: quinSegle, make: () => {
    const y = randYear(), c = cent(y);
    let ds = [c - 1, c + 1].filter(x => x >= 1 && x <= 21);
    if (ds.length < 2) ds.push(c === 1 ? 3 : c - 2);
    return {ans: c, opts: [c, ...ds].map(x => ({v: x, h: segHTML(x)})),
      ask: `<span class="qbig">${y}</span><span class="en">De quin segle és? · Which century is it?</span>`,
      why: explain(y),
      hint: y % 100 === 0 ? 'Pista: un any acabat en 00 és l\'últim any del segle. <span class="en">Hint: 00 is the last year of its century.</span>'
                          : 'Pista: tapa les dues últimes xifres i suma-hi 1. <span class="en">Hint: cover the last two digits and add 1.</span>'};
  }});
}

/* ---------- quins anys hi caben ---------- */
function quinsAnys() {
  BACK = home;
  const R = 5; let r = 0, perfect = 0;
  app.innerHTML = bar('Quins anys hi caben?', 'Which years fit?', true) + `
  <div class="status"><span>Ronda · Round: <b id="c">1</b> / ${R}</span><span>Rondes perfectes · Perfect: <b id="p">0</b></span></div>
  <div class="wq" id="q"></div><div class="chips" id="ch"></div>
  <div class="legend">Clica tots els anys d'aquest segle i després «Comprova». <span class="en">Click all the years of this century, then «Check».</span></div>
  <div class="msg" id="msg"></div><button class="next" id="go">Comprova · Check</button>`;
  wire(); app.querySelector('[data-act="help"]').onclick = () => howto('quinsanys', quinsAnys);
  const go = app.querySelector('#go'), msg = app.querySelector('#msg');
  let years = [], c = 0, checked = false;
  const round = () => {
    checked = false; c = rnd(L().min, L().max); app.querySelector('#c').textContent = r + 1;
    const ins = new Set(), outs = new Set();
    if (L().z && c * 100 <= NOW) ins.add(c * 100);
    let guard = 0;
    while (ins.size < 4 && guard++ < 200) ins.add(yearIn(c, false));
    // trampa: anys que comencen pel número del segle (són del segle següent)
    if (c < 21 && c * 100 + 1 <= NOW) outs.add(rnd(c * 100 + 1, Math.min(c * 100 + 99, NOW)));
    if (L().z && c > 1) outs.add((c - 1) * 100);
    guard = 0;
    while (outs.size < 4 && guard++ < 200) {
      const cc = Math.random() < 0.5 ? c - 1 : c + 1;
      if (cc < 1 || cc > 21 || (cc - 1) * 100 + 1 > NOW) continue;
      outs.add(yearIn(cc, false));
    }
    years = shuffle([...ins].map(y => ({y, ok: true})).concat([...outs].map(y => ({y, ok: false}))));
    app.querySelector('#q').innerHTML = `<span class="en">Quins anys són del… · Which years belong to the…</span>${segHTML(c)}`;
    app.querySelector('#ch').innerHTML = years.map((o, i) => `<button class="ych" data-i="${i}" aria-pressed="false">${o.y}</button>`).join('');
    app.querySelectorAll('.ych').forEach(b => b.onclick = () => { if (checked) return; sfx('tap'); b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true'); });
    msg.className = 'msg'; msg.innerHTML = ''; go.textContent = 'Comprova · Check';
  };
  go.onclick = () => {
    if (!checked) {
      checked = true; let bad = 0;
      app.querySelectorAll('.ych').forEach(b => {
        const o = years[+b.dataset.i], on = b.getAttribute('aria-pressed') === 'true';
        if (on && o.ok) b.classList.add('good');
        else if (on && !o.ok) { b.classList.add('wrong'); bad++; b.innerHTML += `<small>segle ${ROM(cent(o.y))}</small>`; }
        else if (!on && o.ok) { b.classList.add('missed'); bad++; }
      });
      const lo = (c - 1) * 100 + 1, hi = c * 100;
      if (!bad) { sfx('ok'); perfect++; app.querySelector('#p').textContent = perfect; msg.className = 'msg ok'; msg.innerHTML = `Perfecte! El segle ${ROM(c)} va del ${lo} al ${hi}. <span class="en">Perfect!</span>`; }
      else { sfx('bad'); msg.className = 'msg bad'; msg.innerHTML = `Compte: el segle <b>${ROM(c)}</b> va del <b>${lo}</b> al <b>${hi}</b>. ${c > 1 ? `Els anys que comencen per <b>${c - 1}</b> hi van; els que comencen per <b>${c}</b> són del segle següent${L().z ? ', excepte el que acaba en 00' : ''}.` : ''} <span class="en">Careful!</span>`; }
      r++; go.textContent = r === R ? 'Acaba · Finish' : 'Següent · Next';
    } else {
      if (r === R) { go.hidden = true; winBox(`Has fet les ${R} rondes. Rondes perfectes: ${perfect}.`, quinsAnys); }
      else round();
    }
  };
  round();
}

/* ---------- posa'l al seu segle ---------- */
function posa() {
  BACK = home;
  const pool = EVENTS.filter(e => cent(e.y) >= L().min && cent(e.y) <= L().max);
  const evs = shuffle(pool).slice(0, 6);
  let cs = [...new Set(evs.map(e => cent(e.y)))];
  if (LV === 'curs') cs = Array.from({length: 7}, (_, i) => 15 + i);
  else { const extra = shuffle(Array.from({length: 21}, (_, i) => i + 1).filter(c => !cs.includes(c))).slice(0, 2); cs = cs.concat(extra); }
  cs.sort((a, b) => a - b);
  let sel = null, done = 0, errors = 0;
  app.innerHTML = bar("Posa'l al seu segle", 'Put it in its century', true) + `
  <p style="margin:0 0 10px">Clica un <b>fet</b> i després el seu <b>segle</b>. <span class="en">Click an event, then its century.</span></p>
  <div class="pgrid"><div><div class="sub">Fets · Events</div><div class="evs">${evs.map((e, i) => `<button class="ev2" data-i="${i}"><span class="y">${e.y}</span>${e.ca}<span class="en">${e.en}</span></button>`).join('')}</div></div>
  <div><div class="sub">Línia del temps · Timeline</div><div class="slots">${cs.map(c => `<button class="slot2" data-c="${c}" style="background:${segColor(c)}"><span class="hd"><b>${ROM(c)}</b><span>segle ${CA[c]}</span><br><span class="en">${ORD(c)} c.</span></span><span class="in2"></span></button>`).join('')}</div></div></div>
  <div class="msg" id="msg"></div>`;
  wire(); app.querySelector('[data-act="help"]').onclick = () => howto('posa', posa);
  const msg = app.querySelector('#msg');
  app.querySelectorAll('.ev2').forEach(b => b.onclick = () => { if (sel) sel.classList.remove('sel'); sel = b; b.classList.add('sel'); sfx('tap'); });
  app.querySelectorAll('.slot2').forEach(s => s.onclick = () => {
    if (!sel) { msg.className = 'msg bad'; msg.innerHTML = 'Primer clica un fet. <span class="en">First click an event.</span>'; return; }
    const e = evs[+sel.dataset.i], c = cent(e.y);
    if (+s.dataset.c === c) {
      sfx('ok'); s.querySelector('.in2').insertAdjacentHTML('beforeend', `<span class="pl"><b>${e.y}</b> ${e.ca}</span>`);
      sel.remove(); sel = null; done++;
      msg.className = 'msg ok'; msg.innerHTML = 'Molt bé! ' + explain(e.y);
      if (done === evs.length) winBox(`Has col·locat els ${evs.length} fets. Errors: ${errors}.`, posa);
    } else {
      sfx('bad'); errors++; shake(sel); shake(s);
      msg.className = 'msg bad'; msg.innerHTML = `No és aquest segle. Pista: tapa les dues últimes xifres de <b>${e.y}</b> i suma-hi 1. <span class="en">Try again.</span>`;
    }
  });
}

home();
</script>
